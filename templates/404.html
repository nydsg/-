<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面不存在</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f1116; color: #e6e8ef;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      max-width: 520px; padding: 48px 40px; text-align: center;
      background: #171a22; border: 1px solid #262b36; border-radius: 16px;
    }
    .code { font-size: 72px; font-weight: 700; letter-spacing: 4px; color: #4c7dff; line-height: 1; }
    h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
    p { color: #8b93a7; font-size: 14px; line-height: 1.7; margin: 0 0 28px; }
    a {
      display: inline-block; padding: 10px 22px; border-radius: 10px;
      background: #4c7dff; color: #fff; text-decoration: none; font-size: 14px;
    }
    a:hover { background: #3b69e0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>页面不存在</h1>
    <p>你访问的地址可能已被删除、改名，或者链接本身写错了。</p>
    <a href="/index">返回首页</a>
  </div>
</body>
</html>

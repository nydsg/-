<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知 - 功能开发中</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 15%, #1d2b3a 0%, #0b1017 70%);
      color: #e8eef6;
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 36px 32px;
      text-align: center;
      background: #151d27;
      border: 1px solid #263445;
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
    }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 4px 12px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #7fd1ff;
      border: 1px solid #2f4d66;
      border-radius: 999px;
    }
    h1 { margin: 0 0 12px; font-size: 26px; font-weight: 600; }
    p { margin: 0 0 26px; font-size: 15px; line-height: 1.7; color: #9fb0c4; }
    a {
      display: inline-block;
      padding: 10px 22px;
      font-size: 15px;
      color: #fff;
      text-decoration: none;
      background: #2f7fff;
      border-radius: 8px;
    }
    a:hover { background: #1f6ae6; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">功能开发中</span>
    <h1>通知</h1>
    <p>通知功能正在开发中，后续的站内通知会显示在这里。</p>
    <a href="/index">返回首页</a>
  </main>
</body>
</html>
